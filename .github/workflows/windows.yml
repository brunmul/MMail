name: Windows
on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test the core (mail, cache, MCP tools)
        run: dotnet test tests/MMail.Core.Tests -c Release
      - name: Build the app (WinUI 3, self-contained)
        run: dotnet publish src/MMail.App/MMail.App.csproj -c Release -r win-x64 -p:Platform=x64 -o out/MMail
      - name: Build the Claude bridge (mmail-mcp.exe)
        run: dotnet publish src/MMail.Mcp/MMail.Mcp.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out/MMail
      - name: Check the package
        shell: pwsh
        run: |
          foreach ($f in "MMail.exe", "mmail-mcp.exe", "Assets/MMail.png", "Assets/MMail.ico") {
            if (-not (Test-Path "out/MMail/$f")) { throw "missing $f" }
          }
          Compress-Archive -Path out/MMail/* -DestinationPath MMail-Windows-x64.zip
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "could not install Inno Setup" }
          }
          & $iscc /Qp "/DAppVersion=0.1.${{ github.run_number }}" /DSourceDir=..\out\MMail /DOutputDir=..\out installer\MMail.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          if (-not (Test-Path out/MMail-Setup.exe)) { throw "missing MMail-Setup.exe" }
      - uses: actions/upload-artifact@v4
        with:
          name: MMail-Windows-x64
          path: |
            windows/out/MMail-Setup.exe
            windows/MMail-Windows-x64.zip
      # Ready-to-install build of the facteur branch, published as a prerelease.
      - name: Publish prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/facteur'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete facteur-windows-latest --yes --cleanup-tag
          gh release create facteur-windows-latest out/MMail-Setup.exe MMail-Windows-x64.zip --prerelease --target "$env:GITHUB_SHA" --title "MMail pour Windows (facteur) – dernière version" --notes "Build automatique de la branche facteur ($env:GITHUB_SHA). Télécharger et lancer MMail-Setup.exe (installation pour l'utilisateur, sans droits administrateur). Le zip reste disponible pour une version portable."
